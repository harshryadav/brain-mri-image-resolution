services:
  # Default service for the grader's "single command" path. `bash run.sh`
  # invokes this. Pulls preprocessed data on first run, then evaluates every
  # bundled checkpoint and writes runs/results.csv + sample triplet PNGs.
  demo:
    build: .
    image: brainsr:latest
    container_name: brainsr-demo
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src
      - PROCESSED_DATA_URL=${PROCESSED_DATA_URL:-https://huggingface.co/datasets/UMaryland/brain-mri-superresolution-group11/resolve/main/processed.tar.gz}
      - CHECKPOINTS_URL=${CHECKPOINTS_URL:-}
      - BRAINSR_DEVICE=${BRAINSR_DEVICE:-}
    volumes:
      - ${PROCESSED_DIR:-./data/processed}:/workspace/data/processed
      - ${RUNS_DIR:-./runs}:/workspace/runs
      - ./checkpoints:/workspace/checkpoints
    entrypoint: ["python", "-m", "brainsr.cli.demo"]
    # Uncomment for GPU. Requires the NVIDIA Container Toolkit on the host.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Long-lived dev environment. Bind-mounts source for live editing.
  dev:
    build: .
    image: brainsr:latest
    container_name: brainsr-dev
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src
      - PROCESSED_DATA_URL=${PROCESSED_DATA_URL:-https://huggingface.co/datasets/UMaryland/brain-mri-superresolution-group11/resolve/main/processed.tar.gz}
      - CHECKPOINTS_URL=${CHECKPOINTS_URL:-}
      - BRAINSR_DEVICE=${BRAINSR_DEVICE:-}
    volumes:
      - ${FASTMRI_DIR:-./data/raw}:/data/raw:ro
      - ${PROCESSED_DIR:-./data/processed}:/workspace/data/processed
      - ${RUNS_DIR:-./runs}:/workspace/runs
      - ./data/sample:/workspace/data/sample
      - ./checkpoints:/workspace/checkpoints
      - ./src:/workspace/src
      - ./configs:/workspace/configs
      - ./scripts:/workspace/scripts
      - ./tests:/workspace/tests
    entrypoint: []
    command: ["bash"]
    stdin_open: true
    tty: true
    # Uncomment for GPU. See note above.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  preprocess:
    extends: dev
    container_name: brainsr-preprocess
    entrypoint: ["python", "-m", "brainsr.cli.preprocess"]
    command: ["--input-dir", "/data/raw", "--output-dir", "/workspace/data/processed"]

  train:
    extends: dev
    container_name: brainsr-train
    entrypoint: ["python", "-m", "brainsr.cli.train"]
    # Pass `--config configs/eN_*.yaml` via `docker compose run --rm train --config ...`
    command: []

  tensorboard:
    extends: dev
    container_name: brainsr-tb
    entrypoint: ["tensorboard"]
    command: ["--logdir", "/workspace/runs", "--port", "6006", "--bind_all"]
    ports:
      - "6006:6006"
