[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainsr"
version = "0.1.0"
description = "Medical image super-resolution for brain MRI on the FastMRI dataset (MSML640 project)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Harsh Yadav" },
    { name = "Deepika Ghotra" },
    { name = "Utkrisht Nath" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "Pillow>=10.0",
    "scikit-image>=0.22",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "torchmetrics>=1.3",
    "tensorboard>=2.16",
]

[project.optional-dependencies]
torch = [
    "torch>=2.2",
    "torchvision>=0.17",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[project.scripts]
brainsr-preprocess = "brainsr.cli.preprocess:main"
brainsr-train = "brainsr.cli.train:main"
brainsr-eval = "brainsr.cli.eval:main"
brainsr-predict = "brainsr.cli.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
