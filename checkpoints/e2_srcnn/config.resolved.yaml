seed: 42
batch_size: 32
num_workers: 2
epochs: 100
lr: 0.0001
lr_step_size: 20
lr_gamma: 0.5
loss: mse
mixed_precision: false
log_every: 50
save_plots_every: 5
grad_clip: 0.0
data:
  root: data/processed
  scale: 4
  sigma_range:
  - 0.5
  - 2.0
output_dir: runs/e2_srcnn
model:
  name: srcnn
  in_channels: 1
  out_channels: 1
  n1: 64
  n2: 32
