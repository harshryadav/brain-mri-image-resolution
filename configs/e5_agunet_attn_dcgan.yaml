defaults: base.yaml

output_dir: runs/e5_agunet_attn_dcgan

epochs: 100
batch_size: 16
lr: 1.0e-3

critic_lr: 1.0e-4
critic_steps: 1
critic_intensity: 0.1
critic_kind: bce
label_smoothing: 0.1

model:
  name: agunet
  in_channels: 1
  out_channels: 1
  num_filters: 16
  depth: 4
  normalization: instancenorm
  activation: leakyrelu
  dropout: 0.0
  use_attention: true
  residual: true

critic:
  name: dcgan
  in_channels: 1
  num_filters: 16
  num_blocks: 4
  dropout: 0.0
  use_spectral_norm: true
